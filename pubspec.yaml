name: yournails
description: "Приложение для примерки дизайна ногтей"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Камера и работа с фото
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Обработка изображений
  image: ^4.5.3

  # State management
  provider: ^6.1.2

  # Работа с файлами
  path_provider: ^2.1.5

  # Поделиться в соцсети
  share_plus: ^10.1.4

  cupertino_icons: ^1.0.8

  # Локальная база данных
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Генерация уникальных ID
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Временно закомментировано — раскомментируем когда добавим PNG
  # assets:
  #   - assets/designs/