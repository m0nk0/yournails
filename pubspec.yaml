name: yournails
description: "Приложение для примерки дизайна ногтей"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Иконки
  cupertino_icons: ^1.0.8

  # Камера и работа с фото
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Обработка изображений и GIF-экспорт
  image: ^4.5.3

  # State management
  provider: ^6.1.2

  # Работа с файлами
  path_provider: ^2.1.5

  # Поделиться в соцсети
  share_plus: ^10.1.4

  # Локальная база данных
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Генерация уникальных ID
  uuid: ^4.3.3

  gal: ^2.3.0

  flutter_quick_video_encoder: ^1.7.2

  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.svg