name: yournails
description: "Твои Ноготочки — цифровая студия дизайна ногтей"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Шрифты дизайн-системы (Unbounded + Golos Text, кириллица)
  google_fonts: ^6.2.1

  # Иконки
  cupertino_icons: ^1.0.8

  # Камера и работа с фото
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Обработка изображений
  image: ^4.5.3

  # State management
  provider: ^6.1.2

  # Работа с файлами
  path_provider: ^2.1.5

  # Выбор файлов для импорта (3.4 экспорт/импорт библиотеки)
  file_picker: ^8.1.4

  # Поделиться в соцсети
  share_plus: ^10.1.4

  # Локальная база данных
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Генерация уникальных ID
  uuid: ^4.3.3

  # Сохранение в галерею
  gal: ^2.3.0

  # Экспорт видео
  flutter_quick_video_encoder: ^1.7.2

  # SVG-логотип
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Генерация иконки приложения
  flutter_launcher_icons: ^0.13.1

  # Генерация нативного сплэша (пакет, версия обязательна)
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.svg

flutter_launcher_icons:
  android: true
  ios: false
  # Иконка: розовый логотип на navy-фоне (премиальный контраст)
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1C1C28"
  adaptive_icon_foreground: "assets/icon/icon.png"

# КОНФИГ сплэша — верхний уровень, один блок
flutter_native_splash:
  # Однотонный премиальный navy: логотип вспыхивает на тёмном
  color: "#1C1C28"

  android: true
  ios: false
  web: false

  # Android 12+: системный сплэш = фон + иконка приложения
  android_12:
    color: "#1C1C28"
    icon_background_color: "#1C1C28"